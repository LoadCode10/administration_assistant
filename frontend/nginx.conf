server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Les scripts et la feuille de style sont copies tels quels dans
        # l'image : aucun condensat dans leur nom, donc rien qui change d'URL
        # quand leur contenu change. Sans en-tete de cache, le navigateur
        # applique sa propre heuristique et peut resservir un ancien js/
        # pendant des heures — on a vu le cas : un charts.js perime repondait
        # « linesMulti is not a function » alors que le serveur servait deja
        # la bonne version.
        #
        # « no-cache » ne veut pas dire « ne stocke pas » mais « revalide
        # avant de resservir » : l'ETag reste utilise, et une ressource
        # inchangee revient en 304 sans etre retransmise.
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}