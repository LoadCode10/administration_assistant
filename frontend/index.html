<!-- Etat d'attente du demarrage : la page ne sait pas encore qui est connecte
     (GET /citizen/me est en vol). Il disparait avec la classe « is-booting »
     posee sur <body>, une fois la session tranchee — voir js/app.js. -->
<div class="boot" id="boot" role="status">
  <div class="boot-dot" aria-hidden="true"></div>
  <p>Chargement…</p>
</div>

<div class="layout">

  <!-- ================= En-tête ================= -->
  <header class="topbar">
    <button type="button" class="icon-btn menu-btn" id="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
      <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
    </button>

    <!-- LOGO — remplacez ce <svg> et le texte par votre marque. -->
    <a class="brand" href="#/dashboard">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--fill-brand)"/>
        <path d="M9 11.5h14M9 16h14M9 20.5h9" stroke="var(--on-brand)" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">Procédures</span>
        <span class="brand-sub">Console d'administration</span>
      </span>
    </a>

    <div class="topbar-spacer"></div>
    <div class="topbar-user" id="topbar-user"></div>
  </header>

  <!-- ================= Barre latérale ================= -->
  <aside class="sidebar" id="sidebar" aria-label="Navigation principale"></aside>
  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

  <!-- ================= Écran courant ================= -->
  <main id="screen-root" class="screen-root" aria-live="polite"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="assertive"></div>

<!-- Rendu Markdown des réponses de l'assistant : « marked » convertit,
     « DOMPurify » nettoie. Les deux sont facultatifs — si le CDN est
     injoignable, l'écran de discussion retombe sur le texte brut échappé. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/lib/marked.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
